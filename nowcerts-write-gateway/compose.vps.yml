services:
  intake-gate:
    build:
      context: .
      dockerfile: Dockerfile
    image: rsg-intake-gate:local
    container_name: rsg-intake-gate
    restart: unless-stopped
    environment:
      GATEWAY_MODE: pilot
      GATEWAY_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8787
      PYTHON_BIN: /opt/report-venv/bin/python3
      NOWCERTS_MCP_URL: http://rsg-nowcerts-read:8082/mcp
      NOWCERTS_MCP_TOKEN_FILE: /run/secrets/nowcerts-mcp-token
      HERMES_PREVIEW_URL: http://hermes-api:8787
      # Live AMS writes (insured create -> Prospect). Armed only when the token
      # file below is present; each write still requires human review + approval.
      LIVE_AMS_WRITES: "on"
      MOMENTUM_MCP_URL: https://mcp.momentumamp.com/mcp
      MOMENTUM_MCP_TOKEN_FILE: /run/secrets/momentum-mcp-token
      # Property enrichment for the "Get property details" button (read-only,
      # report-only). ATTOM = building characteristics + coords; FEMA flood is
      # keyless. Base URLs default in-code; only the key file is needed.
      ATTOM_API_KEY_FILE: /run/secrets/attom-api-key
      # NAICS classification key — staged/forward-ready. The NaicsEnricher is not
      # yet consumed by server.js (runIntake path), so this is inert until that
      # enricher is wired into the live pipeline; harmless to set now.
      NAICS_API_KEY_FILE: /run/secrets/naics-api-key
      # Encryption at rest for intake bundles and proposals. Must be present
      # before any contact DOB / driver's licence is captured. Generate with
      # `openssl rand -hex 32`; back it up in 1Password before first use —
      # losing it makes already-encrypted records unrecoverable.
      GATEWAY_ENCRYPTION_KEY_FILE: /run/secrets/record-encryption-key
      # Malware scanning for uploads. Mandatory now that images are accepted:
      # REQUIRE_MALWARE_SCAN=on refuses uploads if no scanner is configured, and
      # a scanner outage rejects uploads rather than admitting them unscanned.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      REQUIRE_MALWARE_SCAN: "on"
      # Hermes CRM intake submission -- the intake's destination. Ships dark:
      # flip to "1" only after verifying against one real intake. Additive and
      # never blocks an intake; a CRM outage is reported, not thrown.
      #
      # Nothing on this path reaches NowCerts. An intake is a prospect, and the
      # insured/policy are written to the AMS when a deal is WON. The "Send to
      # AMS" proposal path stays available as an explicit operator action.
      HERMES_CRM_WRITES: "0"
      # Key for Hermes' POST /api/intake (its RSG_INTAKE_API_KEY). A DIFFERENT
      # credential from the bearer: sent as X-RSG-API-Key. Configured-but-empty
      # throws at startup rather than degrading into 401s that look like an
      # outage; leave the file unmounted to run without CRM submission.
      HERMES_INTAKE_KEY_FILE: /run/secrets/hermes-intake-key
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:8790:8787"
    volumes:
      - /var/lib/rsg-intake-gate:/data
      - /etc/rsg-intake-gate/nowcerts-mcp-token:/run/secrets/nowcerts-mcp-token:ro
      - /etc/rsg-intake-gate/momentum-mcp-token:/run/secrets/momentum-mcp-token:ro
      - /etc/rsg-intake-gate/attom-api-key:/run/secrets/attom-api-key:ro
      - /etc/rsg-intake-gate/naics-api-key:/run/secrets/naics-api-key:ro
      - /etc/rsg-intake-gate/record-encryption-key:/run/secrets/record-encryption-key:ro
      - /etc/rsg-intake-gate/hermes-intake-key:/run/secrets/hermes-intake-key:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - nowcerts
      - hermes

  # Malware scanning for uploaded PDFs and images. Reachable only on the compose
  # default network — no host port is published, so nothing outside this stack
  # can talk to clamd. Signature updates come from freshclam inside the image.
  clamav:
    image: clamav/clamav:1.4
    container_name: rsg-intake-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - /var/lib/rsg-intake-clamav:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # clamdcheck confirms the daemon has loaded its signature database, not
      # merely that the container is up. Long start period: the first
      # freshclam pull takes a few minutes on a cold volume.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - default

networks:
  nowcerts:
    external: true
    name: app_default
  hermes:
    external: true
    name: hermes-shared
